      tool_label: 维基百科搜索
      tool_name: wikipedia_search
      tool_parameters:
        language: null
        query: null
      type: builtin
    - enabled: true
      notAuthor: false
      provider_id: langgenius/openweather/openweather
      provider_name: langgenius/openweather/openweather
      provider_type: builtin
